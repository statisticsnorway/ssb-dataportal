apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: dapla-metadata
  name: dataportalen-dev
  namespace: dapla-metadata
spec:
  ingresses:
    - https://dataportal-dev.test.ssb.no
  port: 3000
  accessPolicy:
    outbound:
      rules:
        - application: metadata-api-gateway
        - application: klass
      external:
        - host: auth.test.ssb.no
  login:
    provider: openid
  ttl: 8h
  replicas:
    max: 1
    min: 1
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  envFrom:
    - secret: dataportalen
  env:
    - name: METADATA_API_BASE_PATH
      value: http://metadata-api-gateway
    - name: VARDEF_USE_STATIC_DATA
      value: "false"
    - name: DATADOC_USE_STATIC_DATA
      value: "false"
    - name: DATADOC_USE_M2M_TOKEN
      value: "true"
    - name: VARDEF_USE_M2M_TOKEN
      value: "true"
    - name: KEYCLOAK_HOST
      value: https://auth.test.ssb.no
    - name: KLASS_BASE_PATH
      value: http://klass
    - name: KLASS_USE_STATIC_DATA
      value: "false"
    - name: HIDE_CLASSIFICATIONS
      value: "false"
    - name: DEV_ENVIRONMENT_NAME
      value: "{{ git-ref }}"
    - name: VARDEF_API_DOCS_URL
      value: "https://metadata.test.ssb.no/docs/swagger/variable-definitions"
    - name: KLASS_API_DOCS_URL
      value: "https://data.test.ssb.no/api/klass/swagger-ui/index.html"
    - name: DAPLA_LAB_VARDEF_URL
      value: "https://lab.dapla-test.ssb.no/launcher/dapla-lab-standard/vardef-forvaltning"
