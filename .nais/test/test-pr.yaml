apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: dapla-metadata
  name: metadata-catalog-dev
  namespace: dapla-metadata
spec:
  ingresses:
  - https://metadata-catalog-dev.test.ssb.no
  image: {{image}}
  port: 3000
  accessPolicy:
    outbound:
      external:
        # Allow egress to public Vardef
        - host: vardef.intern.test.ssb.no
        - host: klass.intern.test.ssb.no
        - host: data.ssb.no
        - host: auth.test.ssb.no
  login:
    provider: openid
    enforce:
      enabled: true
  ttl: 5h
  replicas:
    max: 1
    min: 1
  # env:
  #   - name: INTERNAL_BASE_URL
  #     value: http://metadata-catalog
