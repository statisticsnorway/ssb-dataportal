apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: dapla-metadata
  name: metadata-catalog-dev
  namespace: dapla-metadata
spec:
  ingresses:
    - https://metadata-catalog-dev.test.ssb.no
  image: "{{ image }}"
  port: 3000
  accessPolicy:
    outbound:
      rules:
        - application: metadata-api-gateway
        - application: klass
      external:
        - host: data.ssb.no
        - host: auth.test.ssb.no
  login:
    provider: openid
    enforce:
      enabled: true
  ttl: 1h
  replicas:
    max: 1
    min: 1
  env:
    - name: INTERNAL_BASE_URL
      value: http://metadata-catalog
    - name: VARDEF_BASE_URL
      value: http://metadata-api-gateway
    - name: VARDEF_USE_STATIC_DATA
      value: "false"
