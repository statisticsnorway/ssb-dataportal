apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: dapla-metadata
  name: metadata-catalog
  namespace: dapla-metadata
spec:
  ingresses:
    - https://metadata-catalog.test.ssb.no
  port: 3000
  accessPolicy:
    outbound:
      external:
        # Allow egress to public Vardef
        - host: vardef.intern.test.ssb.no
        - host: klass.intern.test.ssb.no
        - host: data.ssb.no
        - host: auth.test.ssb.no
  login:
    provider: openid
    enforce:
      enabled: true
  replicas:
    max: 1
    min: 1
  env:
    - name: VARDEF_USE_STATIC_DATA
      value: "true"
    - name: KLASS_USE_STATIC_DATA
      value: "true"
    - name: DAPLA_LAB_VARDEF_URL
      value: "https://lab.dapla-test.ssb.no/launcher/dapla-lab-standard/vardef-forvaltning"