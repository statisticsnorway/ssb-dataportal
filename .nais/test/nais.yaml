apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: dapla-metadata
  name: dataportalen
  namespace: dapla-metadata
  annotations:
    # Allow nextjs to create cache directories inside /app
    nais.io/read-only-file-system: "false"
spec:
  ingresses:
    - https://dataportal.test.ssb.no
    - https://metadata-catalog.test.ssb.no # TODO: Remove once communicated
  port: 3000
  accessPolicy:
    outbound:
      rules:
        - application: metadata-api-gateway
        - application: klass
      external:
        - host: auth.test.ssb.no
  login:
    provider: openid
    enforce:
      enabled: true
  replicas:
    max: 1
    min: 1
  env:
    - name: VARDEF_BASE_PATH
      value: http://metadata-api-gateway
    - name: VARDEF_USE_STATIC_DATA
      value: "false"
    - name: KLASS_BASE_PATH
      value: http://klass/api/klass/v1
    - name: KLASS_USE_STATIC_DATA
      value: "false"
    - name: DAPLA_LAB_VARDEF_URL
      value: "https://lab.dapla-test.ssb.no/launcher/dapla-lab-standard/vardef-forvaltning"
