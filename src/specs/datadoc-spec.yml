openapi: 3.0.1
info:
  title: Internal Datadoc API
  description: |
    Service to maintain and expose metadata for data in Statistics Norway. Includes the following concepts:

    - Data File: A logically defined blob of data from a file system or object storage.
    - Dataset: A collection of related Data Files which together represent a coherent dataset. These are typically partitioned by time periods.
    - Data Product: A collection of related Data Files that are produced and maintained by a Dapla team. All data which does not directly contribute to publication of a statistic on ssb.no is defined as a Data Product.
    - Statistic Product: A collection of related Data Files that are produced and maintained by a Dapla team, and directly contribute to publication of a statistic on ssb.no. The list of all statistic products is defined by the Statistic Register.
  contact:
    name: Team Metadata
    email: metadata@ssb.no
  license:
    name: CC BY 4.0
    url: https://creativecommons.org/licenses/by/4.0/deed.no
  version: "0.1"
security:
- keycloak-token: []
tags:
- name: Data Files
  description: Maintain and retrieve metadata about Data Files.
- name: Datasets
  description: Retrieve metadata about Datasets.
- name: Data Products
  description: Retrieve metadata about Data Products.
paths:
  /data-files:
    get:
      tags:
      - Data Files
      operationId: listDataFiles
      parameters:
      - name: dataset_id
        in: query
        explode: false
        schema:
          type: string
          format: uuid
          nullable: true
      responses:
        "200":
          description: List Dapla Data Files.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DaplaDataFileDTO"
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DaplaDataFileDTO"
      security:
      - keycloak-token: []
    post:
      tags:
      - Data Files
      operationId: createOrUpdateDaplaDataFile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDaplaDataFile"
            examples:
              example:
                value:
                  file_path: gs://ssb-staging-dapla-felles-data-delt/datadoc/utdata/person-data_p2021_p2022_v2.parquet
        required: true
      responses:
        "201":
          description: The Dapla Data File did not previously exist but has now been
            created.
        "200":
          description: The Dapla Data File already exists and was updated with the
            supplied data.
        "400":
          description: Bad request.
          content:
            application/problem+json:
              schema:
                $ref: https://opensource.zalando.com/restful-api-guidelines/models/problem-1.0.1.yaml#/Problem
              examples:
                Bad request:
                  value:
                    type: about:blank
                    status: 400
                    detail: "Failed to convert argument [example] for value [null]\
                      \ due to: Error deserializing type: example"
                Constraint violation:
                  value:
                    suppressed: []
                    parameters: {}
                    type: https://zalando.github.io/problem/constraint-violation
                    title: Constraint Violation
                    status: 400
                    violations:
                    - field: classificationReference
                      message: Code incorrect is not a valid classification id
      security:
      - metamapper-datadoc-m2m: []
  /data-files/{file-path}:
    get:
      tags:
      - Data Files
      operationId: getDataFileByFilePath
      parameters:
      - name: file-path
        in: path
        required: true
        schema:
          type: string
        content:
          application/json:
            examples:
              example:
                value: gs://ssb-staging-dapla-felles-data-delt/datadoc/utdata/person-data_p2021_p2022_v2.parquet
      responses:
        "200":
          description: Get the Dapla Data File by its file path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaplaDataFileDTO"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DaplaDataFileDTO"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: https://opensource.zalando.com/restful-api-guidelines/models/problem-1.0.1.yaml#/Problem
              examples:
                Not found:
                  value:
                    type: about:blank
                    status: 404
                    detail: Not found
                    parameters: {}
      security:
      - keycloak-token: []
  /data-products:
    get:
      tags:
      - Data Products
      operationId: listDataProducts
      parameters:
      - name: productType
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/DataProductType"
      responses:
        "200":
          description: List Data Products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataProductDTO"
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataProductDTO"
      security:
      - keycloak-token: []
  /data-products/{short-name}:
    get:
      tags:
      - Data Products
      operationId: getDataProductByShortName
      parameters:
      - name: short-name
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Get the Data Product by its short name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProductDTO"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DataProductDTO"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: https://opensource.zalando.com/restful-api-guidelines/models/problem-1.0.1.yaml#/Problem
              examples:
                Not found:
                  value:
                    type: about:blank
                    status: 404
                    detail: Not found
                    parameters: {}
      security:
      - keycloak-token: []
  /datasets:
    get:
      tags:
      - Datasets
      operationId: listDatasets
      parameters:
      - name: product_short_name
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      - name: storage_location
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: List Datasets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetDTO"
            application/problem+json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetDTO"
      security:
      - keycloak-token: []
  /datasets/{id}:
    get:
      tags:
      - Datasets
      operationId: getDatasetById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Get a Dataset by ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDTO"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/DatasetDTO"
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: https://opensource.zalando.com/restful-api-guidelines/models/problem-1.0.1.yaml#/Problem
              examples:
                Not found:
                  value:
                    type: about:blank
                    status: 404
                    detail: Not found
                    parameters: {}
      security:
      - keycloak-token: []
    delete:
      tags:
      - Datasets
      summary: Delete a dataset.
      description: Delete a dataset. Also deletes the data files which make up this
        dataset. May delete a data product if this is the only dataset which is part
        of the product.
      operationId: deleteDatasetById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Delete a Dataset by ID.
        "404":
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: https://opensource.zalando.com/restful-api-guidelines/models/problem-1.0.1.yaml#/Problem
              examples:
                Not found:
                  value:
                    type: about:blank
                    status: 404
                    detail: Not found
                    parameters: {}
      security:
      - keycloak-token: []
components:
  schemas:
    Assessment:
      type: string
      description: Describes the confidentiality level implied by where a dataset
        is stored in the Dapla folder structure.
      enum:
      - SENSITIVE
      - PROTECTED
      - OPEN
    CreateDaplaDataFile:
      required:
      - file_path
      type: object
      properties:
        file_path:
          type: string
      description: Create a Data File. A Data File is a logically defined blob of
        data from a file system or object storage. Its file path shall follow Dapla's
        naming conventions.
    DaplaDataFileDTO:
      required:
      - file_name
      - file_path
      - naming_standard_violations
      type: object
      properties:
        file_path:
          type: string
          description: The file path of the data file. This is the unique identifier
            of the data file.
        file_name:
          type: string
          description: "The filename of the data file, extracted from the file path."
        storage_location_name:
          type: string
          description: "The name of the storage location where the data file is stored.\
            \ In the case of object storage, this is the name of the bucket."
          nullable: true
        file_type:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/FileType"
        data_last_modified_at:
          type: string
          description: "The last modified timestamp of the data file, as reported\
            \ by the storage provider."
          format: date-time
          nullable: true
        checksum:
          type: string
          description: "The checksum of the data file, as reported by the storage\
            \ provider. This may be used to detect changes in the data file."
          nullable: true
        short_description:
          type: string
          description: "A short description of the data file, sourced from the file\
            \ path. \\[Defined in the Dapla Manual.\\](https://manual.dapla.ssb.no/statistikkere/navnestandard.html#filnavn)"
          nullable: true
        product_type:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/DataProductType"
        product_short_name:
          type: string
          description: "The identifier of the product this data file belongs to, sourced\
            \ from the file path. If this is a \\[DataProductType.STATISTIC_PRODUCT\\\
            ], it must match a short name defined in the Statistic Register. If it\
            \ is a \\[DataProductType.OTHER_DATA_PRODUCT\\], it has no canonical definition,\
            \ but must end with \\`_data\\`."
          nullable: true
        storage_category:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/StorageCategory"
        assessment:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Assessment"
        dataset_state:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/DatasetState"
        data_file_version:
          type: integer
          description: "The version of the data file. Versions correspond to structural\
            \ changes in the data file. \\[Defined in the Dapla Manual.\\](https://manual.dapla.ssb.no/statistikkere/navnestandard.html#versjonering-av-datasett)"
          format: int32
          nullable: true
        contains_data_from:
          type: string
          description: "The start date of the time period the data file covers, sourced\
            \ from the file path."
          format: date-time
          nullable: true
        contains_data_until:
          type: string
          description: "The end date of the time period the data file covers, sourced\
            \ from the file path."
          format: date-time
          nullable: true
        period_type:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/PeriodFormat"
        owner:
          type: string
          description: The uniform name of the Dapla team which owns the data file.
          nullable: true
        naming_standard_violations:
          type: array
          description: The list of naming-standard violations found for the file path.
            Empty means valid.
          items:
            type: string
      description: External representation of a Data File. A Data File is a logically
        defined blob of data from a file system or object storage. Its file path shall
        follow Dapla's naming conventions. This model is used to represent a data
        file to clients.
    DataProductDTO:
      required:
      - has_naming_standard_violations
      type: object
      properties:
        product_type:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/DataProductType"
        product_short_name:
          type: string
          description: The identifier of this product.
          nullable: true
        title:
          type: string
          description: The presentation title of this product.
          nullable: true
        subject_code:
          type: string
          description: The subject area this product is categorized within. Defined
            by codes in Level 2 of https://www.ssb.no/klass/klassifikasjoner/618
          nullable: true
        has_naming_standard_violations:
          type: boolean
      description: Data Product
    DataProductType:
      type: string
      description: The type of data product.
      enum:
      - OTHER_DATA_PRODUCT
      - STATISTIC_PRODUCT
      x-enum-descriptions:
      - An other data product is a collection of related data files that are produced
        and maintained by a Dapla team. All data which does not directly contribute
        to publication of a statistic on ssb.no is defined as a Data Product.
      - "A statistic product is a collection of related data files that are produced\
        \ and maintained by a Dapla team, and directly contribute to publication of\
        \ a statistic on ssb.no. The list of all statistic products is defined by\
        \ the Statistic Register."
    DatasetDTO:
      required:
      - dataset_state
      - has_naming_standard_violations
      - product_short_name
      - short_description
      - storage_location_name
      type: object
      properties:
        id:
          type: string
          format: uuid
          nullable: true
        storage_location_name:
          type: string
          description: "The name of the storage location where the dataset is stored.\
            \ In the case of object storage, this is the name of the bucket."
        product_short_name:
          type: string
          description: "The identifier of the product this dataset belongs to, sourced\
            \ from the file path."
        short_description:
          type: string
          description: "A short description of the dataset, sourced from the file\
            \ path. \\[Defined in the Dapla Manual.\\](https://manual.dapla.ssb.no/statistikkere/navnestandard.html#filnavn)"
        assessment:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/Assessment"
        dataset_state:
          $ref: "#/components/schemas/DatasetState"
        owner:
          type: string
          description: The uniform name of the Dapla team which owns the dataset.
          nullable: true
        has_naming_standard_violations:
          type: boolean
      description: A Dataset is a group of data files within one product and state
        with the same short description.
    DatasetState:
      type: string
      description: Represents the processing state of a dataset as expressed in the
        Dapla path structure.
      enum:
      - SOURCE_DATA
      - INPUT_DATA
      - PROCESSED_DATA
      - STATISTICS
      - OUTPUT_DATA
    FileType:
      type: string
      description: Represents the physical file format of a dataset file.
      enum:
      - PARQUET
      - PARQUET_GZIP
      - PARQUET_PARTITIONED
      - CSV
      - JSON
      - XML
      - XLSX
    PeriodFormat:
      type: string
      description: The category of time period that a data file covers.
      enum:
      - YEAR
      - YEAR_MONTH
      - YEAR_MONTH_DAY
      - YEAR_WEEK
      - BIMESTER
      - QUARTER
      - TRIANNUAL
      - HALF_YEAR
    StorageCategory:
      type: string
      description: Describes the kind of Dapla bucket a data file is stored in.
      enum:
      - SOURCE
      - PRODUCT
      - SHARED
  securitySchemes:
    keycloak-token:
      type: http
      description: A token granted by Statistics Norway's Keycloak instance.
      scheme: bearer
      bearerFormat: JWT
    metamapper-datadoc-m2m:
      type: http
      description: A token granted by Statistics Norway's Keycloak instance. Only
        for use by Metamapper.
      scheme: bearer
      bearerFormat: JWT
