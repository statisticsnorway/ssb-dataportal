exclude: src/libs/data-access/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: Biome format
        name: biome format
        entry: yarn run biome format --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
      - id: Biome lint
        name: biome lint
        entry: yarn run biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
