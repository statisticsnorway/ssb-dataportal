name: Test and lint
on:
  push:
    branches: [main]
    paths-ignore:
      - .agents/**
      - .nais/**
      - scripts/**
      - .gitignore
      - .dockerignore
      - .pre-commit-config.yaml
      - AGENTS.md
      - backstage.yaml
      - Dockerfile
      - LICENSE
      - openapitools.json
      - README.md
      - SECURITY.md
  pull_request:
    branches: [main]
    paths-ignore:
      - .agents/**
      - .nais/**
      - scripts/**
      - .gitignore
      - .dockerignore
      - .pre-commit-config.yaml
      - AGENTS.md
      - backstage.yaml
      - Dockerfile
      - LICENSE
      - openapitools.json
      - README.md
      - SECURITY.md

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint check
        run: pnpm lint:check
      - name: Format check
        run: pnpm format:check

  check-dead-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint check
        run: pnpm lint:dead-code

  type-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Next.js types
        run: pnpm next typegen
      - name: Type check
        run: pnpm tsc --noEmit

  check-prod-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --prod
      - name: Prod build
        run: pnpm run build

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest tests
        run: pnpm test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage/

  e2e-tests:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps
      - name: Run Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: pnpm playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          NEXT_TEST: "test"
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
      - name: Upload e2e coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage-${{ matrix.shardIndex }}
          path: results/e2e-coverage/

  merge-e2e-results:
    needs: [e2e-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        run: pnpm playwright merge-reports --reporter html ./all-blob-reports
      - name: Merge Playwright reports (json)
        run: pnpm playwright merge-reports --reporter json ./all-blob-reports > playwright-report/report.json
      - name: Upload merged Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Comment Playwright summary on PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- playwright-pr-summary -->';
            const reportPath = 'playwright-report/report.json';

            if (!fs.existsSync(reportPath)) {
              core.warning(`Playwright JSON report not found at ${reportPath}`);
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const counts = {
              total: 0,
              passed: 0,
              failed: 0,
              flaky: 0,
              skipped: 0,
            };

            const failedTests = [];

            const getOutcome = (test) => {
              if (test.outcome) return test.outcome;
              const statuses = (test.results ?? []).map((result) => result.status);
              if (statuses.includes('failed') || statuses.includes('timedOut') || statuses.includes('interrupted')) {
                return 'unexpected';
              }
              if (statuses.includes('skipped')) return 'skipped';
              return 'expected';
            };

            const visitSuite = (suite, parents = []) => {
              const nextParents = suite.title ? [...parents, suite.title] : parents;

              for (const spec of suite.specs ?? []) {
                const pathParts = [...nextParents, spec.title].filter(Boolean);

                for (const test of spec.tests ?? []) {
                  counts.total += 1;

                  const outcome = getOutcome(test);
                  if (outcome === 'expected') counts.passed += 1;
                  if (outcome === 'unexpected') counts.failed += 1;
                  if (outcome === 'flaky') counts.flaky += 1;
                  if (outcome === 'skipped') counts.skipped += 1;

                  if (outcome === 'unexpected') {
                    const location = test.location ?? spec.location;
                    const line = location?.line ? `:${location.line}` : '';
                    const project = test.projectName ? ` [${test.projectName}]` : '';
                    failedTests.push(`- ${pathParts.join(' > ')}${project} (${spec.file}${line})`);
                  }
                }
              }

              for (const child of suite.suites ?? []) {
                visitSuite(child, nextParents);
              }
            };

            for (const suite of report.suites ?? []) {
              visitSuite(suite);
            }

            const status = counts.failed > 0 ? 'FAILED' : 'PASSED';
            const failedSection =
              failedTests.length > 0
                ? `\n\n**Failed tests (first 20)**\n${failedTests.slice(0, 20).join('\n')}`
                : '';

            const body = [
              marker,
              '## Playwright E2E summary',
              '',
              `**Status:** ${status}`,
              `- Total: ${counts.total}`,
              `- Passed: ${counts.passed}`,
              `- Failed: ${counts.failed}`,
              `- Flaky: ${counts.flaky}`,
              `- Skipped: ${counts.skipped}`,
              '',
              'Download the `playwright-report` artifact from the `merge-e2e-results` job for full HTML details.',
              failedSection,
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });

              const existingComment = comments.find((comment) =>
                comment.body?.includes(marker),
              );

              if (counts.failed === 0) {
                if (existingComment) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existingComment.id,
                  });
                }
                return;
              }

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Could not create or update PR comment: ${error.message}`);
            }
      - name: Download e2e coverage shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: e2e-coverage-*
          path: all-e2e-coverage
      - name: Merge lcov coverage files
        run: |
          mkdir -p results/e2e-coverage
          pnpm dlx lcov-result-merger 'all-e2e-coverage/*/coverage.lcov' results/e2e-coverage/coverage.lcov
      - name: Upload merged e2e coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: results/e2e-coverage/

  sonarqube:
    if: github.actor != 'dependabot[bot]'
    needs: [unit-tests, merge-e2e-results]
    permissions:
      contents: read
      actions: read
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download unit coverage artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: unit-coverage
          path: coverage/
      - name: Download e2e coverage artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: e2e-coverage
          path: results/e2e-coverage/
      - name: Verify coverage files
        run: |
          echo "=== about.tsx summary in UNIT lcov ==="
          awk '/^SF:.*classifications\/utils\/about\.tsx$/,/^end_of_record$/' coverage/lcov.info \
            | grep -E "^(SF|LF|LH|BRF|BRH):" || true
          echo "=== about.tsx summary in E2E lcov ==="
          awk '/^SF:.*classifications\/utils\/about\.tsx$/,/^end_of_record$/' results/e2e-coverage/coverage.lcov \
            | grep -E "^(SF|LF|LH|BRF|BRH):" || true
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
