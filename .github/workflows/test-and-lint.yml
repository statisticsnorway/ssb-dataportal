name: Test and lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint check
        run: pnpm lint:check
      - name: Format check
        run: pnpm format:check

  check-dead-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint check
        run: pnpm lint:dead-code

  type-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Next.js types
        run: pnpm next typegen
      - name: Type check
        run: pnpm tsc --noEmit

  check-prod-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --prod
      - name: Prod build
        run: pnpm run build

  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Vitest tests
        run: pnpm test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage/

  e2e-tests:
    name: E2E shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    timeout-minutes: 25
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps
      - name: Run Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        continue-on-error: true
        run: pnpm playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          NEXT_TEST: "test"
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          if-no-files-found: error
      - name: Upload e2e coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage-${{ matrix.shardIndex }}
          path: results/e2e-coverage/

  merge-e2e-results:
    name: E2E test results
    needs: [e2e-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright reports
        run: pnpm playwright merge-reports --reporter list,html,json ./all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
      - name: Upload merged Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Download e2e coverage shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: e2e-coverage-*
          path: all-e2e-coverage
      - name: Merge lcov coverage files
        run: |
          mkdir -p results/e2e-coverage
          pnpm dlx lcov-result-merger 'all-e2e-coverage/*/coverage.lcov' results/e2e-coverage/coverage.lcov
      - name: Upload merged e2e coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: results/e2e-coverage/
      - name: Set final e2e status
        if: ${{ always() }}
        env:
          SHARD_JOB_RESULT: ${{ needs.e2e-tests.result }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          if (!fs.existsSync('playwright-report.json')) {
            console.error('The merged Playwright JSON report was not generated.');
            process.exit(1);
          }

          const report = JSON.parse(fs.readFileSync('playwright-report.json', 'utf8'));
          const unexpected = report.stats?.unexpected ?? 0;
          const topLevelErrors = report.errors?.length ?? 0;
          const shardsSucceeded = process.env.SHARD_JOB_RESULT === 'success';

          if (!shardsSucceeded || unexpected > 0 || topLevelErrors > 0) {
            console.error(
              `E2E tests failed: ${unexpected} unexpected test result(s), ${topLevelErrors} top-level error(s), ` +
                `shard job result: ${process.env.SHARD_JOB_RESULT}.`,
            );
            process.exit(1);
          }

          console.log('All merged E2E tests passed.');
          NODE

  sonarqube:
    if: github.actor != 'dependabot[bot]'
    needs: [unit-tests, merge-e2e-results]
    permissions:
      contents: read
      actions: read
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download unit coverage artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: unit-coverage
          path: coverage/
      - name: Download e2e coverage artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: e2e-coverage
          path: results/e2e-coverage/
      - name: Verify coverage files
        run: |
          echo "=== about.tsx summary in UNIT lcov ==="
          awk '/^SF:.*classifications\/utils\/about\.tsx$/,/^end_of_record$/' coverage/lcov.info \
            | grep -E "^(SF|LF|LH|BRF|BRH):" || true
          echo "=== about.tsx summary in E2E lcov ==="
          awk '/^SF:.*classifications\/utils\/about\.tsx$/,/^end_of_record$/' results/e2e-coverage/coverage.lcov \
            | grep -E "^(SF|LF|LH|BRF|BRH):" || true
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
