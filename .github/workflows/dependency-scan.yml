name: Grype security scan and dependency version check
on:
  push:
    branches:
      - main
      - chore/redirect-and-filter-result-security-scan
jobs:
  dependency-version-check:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check outdated dependencies
        run: pnpm outdated || true

  grype-scan:
    runs-on: ubuntu-latest
    # Permissions key is required for CodeQL SARIF Upload, per the docs:
    # https://docs.github.com/en/code-security/code-scanning/integrating-with-code-scanning/uploading-a-sarif-file-to-github
    permissions:
      security-events: write
      contents: "read"
      id-token: "write"
      packages: "read"
      actions: "read"
    env:
      RISK_THRESHOLD: "0.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Build the Container image
        run: docker build . --file Dockerfile --tag ssb-dataportal:latest
      - name: Display scan result as table
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan_table
        with:
          image: "ssb-dataportal:latest"
          output-format: table
          fail-build: false
          severity-cutoff: high
      - name: Create sarif file
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          image: "ssb-dataportal:latest"
          fail-build: false
          severity-cutoff: high
      - name: upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Install Grype CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | \
          sh -s -- -b /usr/local/bin

      - name: Export Grype JSON report
        run: grype ssb-dataportal:latest -o json > grype-report.json

      - name: Filter High/Critical with score > 0.1 and build markdown report
        run: |
          jq '
            [
              .matches[]
              | {
                  package: .artifact.name,
                  installed: .artifact.version,
                  vulnerability: .vulnerability.id,
                  severity: .vulnerability.severity,
                  score: (([.vulnerability.cvss[]?.metrics.baseScore] | max) // 0),
                  fix: (.vulnerability.fix.versions[0] // "none")
                }
              | select((.severity == "High" or .severity == "Critical") and (.score > 0.1))
            ]
          ' grype-report.json > filtered-vulns.json

          COUNT=$(jq 'length' filtered-vulns.json)
          echo "VULN_COUNT=$COUNT" >> "$GITHUB_ENV"

          {
            echo "## Grype filtered vulnerabilities (High/Critical, score > $RISK_THRESHOLD)"
            echo ""
            echo "Count: **$COUNT**"
            echo ""
            if [ "$COUNT" -eq 0 ]; then
              echo "_No matching vulnerabilities found._"
            else
              echo "| Package | Installed | Vulnerability | Severity | Score | Fix |"
              echo "|---|---|---|---|---:|---|"
              jq -r '.[] | "| \(.package) | \(.installed) | \(.vulnerability) | \(.severity) | \(.score) | \(.fix) |"' filtered-vulns.json
            fi
          } > grype-filtered-report.md

      - name: Filter findings (High/Critical + risk threshold)
        run: |
          jq --arg t "$RISK_THRESHOLD" '
            [
              .matches[]
              | select(
                  (.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
                  and ((.vulnerability.risk // 0) > ($t | tonumber))
                )
              | {
                  package: .artifact.name,
                  version: .artifact.version,
                  vulnerability: .vulnerability.id,
                  severity: .vulnerability.severity,
                  risk: (.vulnerability.risk // 0),
                  fix: (.vulnerability.fix.versions[0] // "none")
                }
            ] | sort_by(.risk) | reverse
          ' grype-report.json > filtered-vulns.json

          echo "VULN_COUNT=$(jq 'length' filtered-vulns.json)" >> "$GITHUB_ENV"

      - name: Build HTML report
        run: |
          mkdir -p report
          python3 - << 'PY'
          import json, html
          from pathlib import Path

          data = json.loads(Path("filtered-vulns.json").read_text())
          rows = []
          for d in data:
              rows.append(
                  "<tr>"
                  f"<td>{html.escape(str(d.get('package','')))}</td>"
                  f"<td>{html.escape(str(d.get('version','')))}</td>"
                  f"<td>{html.escape(str(d.get('vulnerability','')))}</td>"
                  f"<td>{html.escape(str(d.get('severity','')))}</td>"
                  f"<td>{d.get('risk',0):.3f}</td>"
                  f"<td>{html.escape(str(d.get('fix','none')))}</td>"
                  "</tr>"
              )

          html_doc = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Grype Vulnerability Report</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; margin: 24px; }}
              h1 {{ margin-bottom: 0.2rem; }}
              .meta {{ color: #555; margin-bottom: 1rem; }}
              table {{ border-collapse: collapse; width: 100%; }}
              th, td {{ border: 1px solid #ddd; padding: 8px; font-size: 14px; }}
              th {{ background: #f6f8fa; text-align: left; }}
              tr:nth-child(even) {{ background: #fafafa; }}
            </style>
          </head>
          <body>
            <h1>Grype Vulnerability Report</h1>
            <div class="meta">High/Critical with risk &gt; 0.1 • Findings: <strong>{len(data)}</strong></div>
            <table>
              <thead>
                <tr>
                  <th>Package</th><th>Version</th><th>Vulnerability</th><th>Severity</th><th>Risk</th><th>Fix</th>
                </tr>
              </thead>
              <tbody>
                {''.join(rows) if rows else '<tr><td colspan="6">No matching findings.</td></tr>'}
              </tbody>
            </table>
          </body>
          </html>"""
          Path("report/grype-report.html").write_text(html_doc)
          PY

      - name: Add visual summary in GitHub UI
        run: |
          {
            echo "## Grype filtered report"
            echo ""
            echo "- Threshold: High/Critical and risk > ${RISK_THRESHOLD}"
            echo "- Findings: **${VULN_COUNT}**"
            echo ""
            echo "Download **grype-visual-report** artifact to open \`grype-report.html\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload filtered report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grype-filtered-report
          path: |
            report/grype-report.html
            grype-report.json
            filtered-vulns.json
