name: Grype security scan and dependency version check

on:
  push:
    branches:
      - main
      - chore/redirect-and-filter-result-security-scan
  workflow_dispatch:

jobs:
  dependency-version-check:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check outdated dependencies
        run: pnpm outdated || true

  grype-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      id-token: write
      packages: read
      actions: read
    env:
      RISK_THRESHOLD: "0.1"
      SEVERITIES: "High,Critical"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Build the container image
        run: docker build . --file Dockerfile --tag ssb-dataportal:latest

      - name: Display scan result as table
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: "ssb-dataportal:latest"
          output-format: table
          fail-build: false
          severity-cutoff: high

      - name: Create SARIF file
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          image: "ssb-dataportal:latest"
          fail-build: false
          severity-cutoff: high

      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Install Grype + jq
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run Grype report script
        run: bash scripts/grype-report.sh ssb-dataportal:latest

      - name: Set finding count
        run: echo "VULN_COUNT=$(jq 'length' filtered-vulns.json)" >> "$GITHUB_ENV"

      - name: Add visual summary in GitHub UI
        run: |
          {
            echo "## Grype filtered report"
            echo "- Threshold: ${SEVERITIES}, risk > ${RISK_THRESHOLD}"
            echo "- Findings: **${VULN_COUNT}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload filtered report artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grype-visual-report
          path: |
            report/index.html
            grype-report.json
            filtered-vulns.json

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: report

  pages-deploy:
    if: github.ref == 'refs/heads/main'
    needs: grype-scan
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
