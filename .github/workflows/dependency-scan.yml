name: Grype security scan and dependency version check

on:
  push:
    branches:
      - main
      - chore/update-grype-result-scan
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight
  workflow_dispatch:
jobs:
  dependency-version-check:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check outdated dependencies
        run: pnpm outdated || true

  grype-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      id-token: write
      packages: read
      actions: read
      pages: write
    env:
      RISK_THRESHOLD: "1.0"
      SEVERITIES: "High,Critical"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Build the container image
        run: docker build . --file Dockerfile --tag ssb-dataportal:latest

      - name: Display scan result as table
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: "ssb-dataportal:latest"
          output-format: table
          fail-build: false
          severity-cutoff: high
          
      - name: Create Docker SARIF file
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        id: scan
        with:
          image: "ssb-dataportal:latest"
          fail-build: false
          severity-cutoff: high

      - name: Install Grype + jq
        env:
          GRYPE_VERSION: v0.114.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run Grype report script
        run: bash scripts/grype-report.sh ssb-dataportal:latest

      - name: Install Grype + jq
        env:
          GRYPE_VERSION: v0.114.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run Grype report script
        run: bash scripts/grype-report.sh ssb-dataportal:latest
    
      - name: Filter Docker SARIF (composite RISK > RISK_THRESHOLD, high/critical)
        run: |
          jq --argjson threshold "${RISK_THRESHOLD}" \
            --slurpfile riskMap risk-map.json '
            ($riskMap[0] // {}) as $risk
            | .runs |= map(
                ((.tool.driver.rules // [])
                  | map(select(type == "object"))
                  | map({ key: (.id // ""), value: . })
                  | from_entries) as $rules
                | .results = (
                    (.results // [])
                    | map(select(type == "object"))
                    | map(
                        . as $r
                        # Composite RISK for this result (0 if not present in map)
                        | (($risk[($r.ruleId // "")] // 0) | tonumber) as $riskScore
                        | select(
                            (($r.level // "") == "error")
                            and ($riskScore > $threshold)
                          )
                        # Prefix message with the composite RISK for visibility in alerts
                        | .message.text = (
                            "[RISK " + ($riskScore | tostring) + "] "
                            + ($r.message.text // "")
                          )
                      )
                  )
                | ((.results // []) | map(.ruleId // empty) | unique) as $keep
                | .tool.driver.rules = (
                    (.tool.driver.rules // [])
                    | map(select(type == "object"))
                    | map(select(($keep | index(.id // "")) != null))
                    # Also mirror composite RISK into the rule's security-severity
                    # so GitHub sorts alerts by the real risk.
                    | map(
                        . as $rule
                        | .properties["security-severity"] =
                            (($risk[($rule.id // "")] // 0) | tostring)
                      )
                  )
              )
          ' "${{ steps.scan.outputs.sarif }}" > docker.filtered.sarif

          echo "Kept results: $(jq '[.runs[].results[]] | length' docker.filtered.sarif)"

      - name: Upload Docker SARIF report
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: docker.filtered.sarif
          category: docker-grype

      - name: Set finding count
        run: echo "VULN_COUNT=$(jq 'length' filtered-vulns.json)" >> "$GITHUB_ENV"

      - name: Upload filtered report artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grype-visual-report
          path: |
            report/index.html
            grype-report.json
            filtered-vulns.json

