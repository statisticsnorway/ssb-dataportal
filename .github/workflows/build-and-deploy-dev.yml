name: Deploy dev instance

on:
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker build
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build and push
        uses: nais/docker-build-push@751a312f0803eb96a05a41fadf51be19b7be362c # v0
        id: docker-build-push
        with:
          team: dapla-metadata

      - uses: nais/deploy/actions/deploy@e90640a98702d2554350fb35c4d5d242dd8e4346 # v2
        env:
          CLUSTER: test
          RESOURCE: .nais/test/dev.yaml
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443
          VAR: git-ref=${{ github.ref_name }}
          WORKLOAD_IMAGE: ${{ steps.docker-build-push.outputs.image }}
          TELEMETRY: ${{ steps.docker-build-push.outputs.telemetry }}
