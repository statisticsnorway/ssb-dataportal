name: Image Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cluster:
        description: "Which cluster to deploy to?"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - prod
  workflow_call:
    inputs:
      cluster:
        description: "Which cluster to deploy to?"
        required: true
        type: string

jobs:
  docker-build:
    name: Docker build
    permissions:
      contents: "read"
      id-token: "write"
      packages: "read"
      actions: "read"
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      telemetry: ${{ steps.docker-build-push.outputs.telemetry }}
      prod-config-changed: ${{ steps.prod-config-changed.outputs.changed != 'non-inputs' }}
      test-config-changed: ${{ steps.test-config-changed.outputs.changed != 'non-inputs' }}
      only-config-changed: ${{ steps.changed-files.outputs.changed == 'only-inputs'}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check what changed
        id: changed-files
        uses: "nais/what-changed@e253615426610a2e873ada19749ca58896f3679f"
        with:
          files: .nais/**/nais.yaml
      - name: Check for test config changes
        id: test-config-changed
        uses: "nais/what-changed@e253615426610a2e873ada19749ca58896f3679f"
        with:
          files: .nais/test/nais.yaml
      - name: Check for prod config changes
        id: prod-config-changed
        uses: "nais/what-changed@e253615426610a2e873ada19749ca58896f3679f"
        with:
          files: .nais/prod/nais.yaml

      - name: Build and push
        if: steps.changed-files.outputs.changed != 'only-inputs' || github.event.inputs.cluster == 'test' || github.event.inputs.cluster == 'prod' || inputs.cluster == 'test' || inputs.cluster == 'prod'
        uses: nais/docker-build-push@751a312f0803eb96a05a41fadf51be19b7be362c # v0
        id: docker-build-push
        with:
          team: dapla-metadata

  deploy-test:
    name: Deploy to test
    needs: docker-build
    permissions:
      contents: "read"
      id-token: "write"
      packages: "read"
    runs-on: ubuntu-latest
    if: github.event.inputs.cluster == 'test' || inputs.cluster == 'test' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: nais/deploy/actions/deploy@e90640a98702d2554350fb35c4d5d242dd8e4346 # v2
        env:
          CLUSTER: test
          RESOURCE: .nais/test/nais.yaml
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443
          WORKLOAD_IMAGE: ${{ needs.docker-build.outputs.image }}
          TELEMETRY: ${{ needs.docker-build.outputs.telemetry }}

  deploy-prod:
    name: Deploy to prod
    needs: docker-build
    permissions:
      contents: "read"
      id-token: "write"
      packages: "read"
    runs-on: ubuntu-latest
    if: github.event.inputs.cluster == 'prod' || inputs.cluster == 'prod' || (github.event_name == 'push' && needs.docker-build.outputs.prod-config-changed == 'true' && needs.docker-build.outputs.only-config-changed == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: nais/deploy/actions/deploy@e90640a98702d2554350fb35c4d5d242dd8e4346 # v2
        env:
          CLUSTER: prod
          RESOURCE: .nais/prod/nais.yaml
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443
          WORKLOAD_IMAGE: ${{ needs.docker-build.outputs.image }}
          TELEMETRY: ${{ needs.docker-build.outputs.telemetry }}

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      vardef: ${{ steps.filter.outputs.vardef }}
      klass: ${{ steps.filter.outputs.klass }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            vardef:
              - 'src/app/**/variable-definitions/**'
              - 'src/libs/data/variable-definitions/**'
              - 'src/libs/data-access/variable-definitions/**'
            klass:
              - 'src/app/**/classifications/**'
              - 'src/libs/data/klass/**'
              - 'src/libs/data-access/klass/**'

  mabl-test:
    name: Mabl (test)
    needs: [deploy-test, changes]
    if: github.event_name == 'push' && needs.deploy-test.result == 'success'
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: vardef
            mablLabel: postmerge-dataportal-vardef-test
            run: ${{ needs.changes.outputs.vardef == 'true' }}
          - label: klass
            mablLabel: postmerge-dataportal-klass-test
            run: ${{ needs.changes.outputs.klass == 'true' }}
    steps:
      - name: Run Mabl tests (test)
        if: matrix.run == 'true'
        uses: mablhq/github-run-tests-action@e46db148f0124be267acff561cd4d9303375852a # v1
        env:
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          application-id: ${{ secrets.MABL_APPLICATION_ID }}
          environment-id: ${{ secrets.MABL_ENVIRONMENT_ID_TEST }}
          plan-labels: ${{ matrix.mablLabel }}
          mabl-branch: ${{ github.ref_name }}

  mabl-prod:
    name: Mabl (prod)
    needs: [deploy-prod, changes]
    if: github.event_name == 'push' && needs.deploy-prod.result == 'success'
    permissions:
      contents: "read"
      id-token: "write"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: vardef
            mablLabel: postmerge-dataportal-vardef-prod
            run: ${{ needs.changes.outputs.vardef == 'true' }}
          - label: klass
            mablLabel: postmerge-dataportal-klass-prod
            run: ${{ needs.changes.outputs.klass == 'true' }}
    steps:
      - name: Run Mabl tests (prod)
        if: matrix.run == 'true'
        uses: mablhq/github-run-tests-action@e46db148f0124be267acff561cd4d9303375852a # v1
        env:
          MABL_API_KEY: ${{ secrets.MABL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          application-id: ${{ secrets.MABL_APPLICATION_ID }}
          environment-id: ${{ secrets.MABL_ENVIRONMENT_ID_PROD }}
          plan-labels: ${{ matrix.mablLabel }}
          mabl-branch: ${{ github.ref_name }}

  mabl-status:
    name: Mabl status
    needs: [mabl-test, mabl-prod]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any Mabl job failed
        run: |
          if [[ "${{ needs.mabl-test.result }}" == "failure" || "${{ needs.mabl-prod.result }}" == "failure" ]]; then
            echo "Mabl tests failed"
            exit 1
          fi
          echo "Mabl OK (test=${{ needs.mabl-test.result }}, prod=${{ needs.mabl-prod.result }})"

