name: Deploy alerts
run-name: Deploy alerts for Dataportalen to test and prod

on:
  push:
    branches:
      - main
    paths:
      - ".nais/prod/alerts.yaml"
      - ".nais/test/alerts.yaml"
      - ".github/workflows/alert-deploy.yml"
permissions:
  id-token: write

jobs:
  test-deploy:
    name: Deploy alerts to test
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Deploy to test
        uses: nais/deploy/actions/deploy@e90640a98702d2554350fb35c4d5d242dd8e4346 # v2
        env:
          CLUSTER: test
          RESOURCE: .nais/test/alerts.yaml
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443

  prod-deploy:
    name: Deploy alerts to prod
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Deploy to prod
        uses: nais/deploy/actions/deploy@e90640a98702d2554350fb35c4d5d242dd8e4346 # v2
        env:
          CLUSTER: prod
          RESOURCE: .nais/prod/alerts.yaml
          DEPLOY_SERVER: deploy.ssb.cloud.nais.io:443
